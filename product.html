<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Cloth Luxury</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .product-page-section {
            padding-top: calc(var(--space-xl) + 80px);
        }
        
        .product-detail-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        /* Image Gallery */
        .product-gallery {
            display: flex;
            gap: 1rem;
            position: sticky;
            top: 100px;
        }
        .thumbnails {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 80px;
        }
        .thumbnail {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: var(--transition);
        }
        .thumbnail.active {
            border-color: var(--clr-accent);
        }
        .main-image-container {
            flex-grow: 1;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 3/4;
            position: relative;
        }
        .main-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .main-image-container:hover img {
            transform: scale(1.05);
        }

        /* Product Info */
        .product-info-wrapper {
            padding-top: 1rem;
        }
        .breadcrumbs {
            font-size: 0.9rem;
            color: var(--clr-text-muted);
            margin-bottom: 1rem;
        }
        .breadcrumbs a {
            transition: color 0.3s ease;
        }
        .breadcrumbs a:hover {
            color: var(--clr-text-main);
        }
        .product-title-large {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .product-price-large {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--clr-accent);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .product-desc {
            color: var(--clr-text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        /* Options */
        .option-group {
            margin-bottom: 1.5rem;
        }
        .option-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            display: block;
        }
        .size-options {
            display: flex;
            gap: 10px;
        }
        .size-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 1px solid var(--clr-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: var(--clr-text-main);
            transition: var(--transition);
        }
        .size-btn:hover, .size-btn.active {
            border-color: var(--clr-accent);
            background: var(--clr-accent);
            color: #fff;
        }

        /* Actions */
        .action-group {
            display: flex;
            gap: 1rem;
            margin: 2rem 0;
            align-items: center;
        }
        .qty-selector {
            display: flex;
            align-items: center;
            border: 1px solid var(--clr-border);
            border-radius: 30px;
            height: 50px;
            overflow: hidden;
        }
        .qty-btn {
            width: 40px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--clr-text-main);
        }
        .qty-btn:hover { background: rgba(255,255,255,0.05); }
        .qty-input {
            width: 40px;
            text-align: center;
            background: transparent;
            color: var(--clr-text-main);
            font-weight: 600;
            border: none;
            -moz-appearance: textfield;
        }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .add-btn {
            flex-grow: 1;
            height: 50px;
        }

        /* Accordion */
        .accordion {
            border-top: 1px solid var(--clr-border);
            margin-top: 3rem;
        }
        .acc-item {
            border-bottom: 1px solid var(--clr-border);
        }
        .acc-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--clr-text-main);
        }
        .acc-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            color: var(--clr-text-muted);
        }
        .acc-content-inner {
            padding-bottom: 1.5rem;
        }
        .acc-item.active .acc-content {
            max-height: 300px;
        }
        .acc-item.active .acc-header i {
            transform: rotate(180deg);
        }
        .acc-header i {
            transition: transform 0.3s ease;
        }

        @media (max-width: 992px) {
            .product-detail-layout {
                grid-template-columns: 1fr;
            }
            .product-gallery {
                position: static;
                flex-direction: column-reverse;
            }
            .thumbnails {
                flex-direction: row;
                width: 100%;
                overflow-x: auto;
            }
            .thumbnail {
                width: 80px;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Navbar -->
    <nav id="navbar" class="navbar scrolled">
        <div class="container nav-container">
            <a href="index.html" class="logo">Cloth<span>.</span></a>
            <ul id="nav-links" class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="shop.html" class="nav-link">Shop</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="faq.html" class="nav-link">FAQ</a></li>
            </ul>
            <div class="nav-icons">
                <button id="theme-toggle" class="nav-icon"><i class="ph ph-sun"></i></button>
                <a href="login.html" id="user-btn" class="nav-icon"><i class="ph ph-user"></i></a>
                <a href="wishlist.html" class="nav-icon">
                    <i class="ph ph-heart"></i>
                    <span id="wishlist-count" class="badge" style="display:none;">0</span>
                </a>
                <a href="cart.html" class="nav-icon">
                    <i class="ph ph-shopping-bag"></i>
                    <span id="cart-count" class="badge" style="display:none;">0</span>
                </a>
                <button id="mobile-menu-btn" class="mobile-menu-btn"><i class="ph ph-list"></i></button>
            </div>
        </div>
    </nav>

    <!-- Product Details -->
    <section class="section product-page-section">
        <div class="container product-detail-layout" id="product-container">
            <!-- Injected via JS -->
        </div>
    </section>

    <!-- Related Products -->
    <section class="section" style="background: var(--clr-surface);">
        <div class="container">
            <h2 class="title-serif text-center mb-4 reveal">You May Also Like</h2>
            <div id="related-grid" class="products-grid">
                <!-- Injected via JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>&copy; 2026 Cloth. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/store.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
    <script src="js/product-detail.js"></script>
</body>
</html>
