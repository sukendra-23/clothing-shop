<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | Cloth Luxury</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .wishlist-section {
            padding-top: calc(var(--space-xl) + 80px);
            min-height: 80vh;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        .empty-wishlist {
            text-align: center;
            padding: 5rem 2rem;
            background: var(--clr-surface);
            border-radius: 16px;
            border: 1px solid var(--clr-border);
            max-width: 600px;
            margin: 2rem auto;
            box-shadow: var(--shadow-glass);
            animation: fadeIn 0.8s ease;
        }
        .empty-wishlist i {
            font-size: 4rem;
            color: var(--clr-text-muted);
            margin-bottom: 1.5rem;
            display: inline-block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Page Loader -->
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Navbar -->
    <nav id="navbar" class="navbar scrolled">
        <div class="container nav-container">
            <a href="index.html" class="logo">Cloth<span>.</span></a>
            
            <ul id="nav-links" class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="shop.html" class="nav-link">Shop</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="faq.html" class="nav-link">FAQ</a></li>
            </ul>

            <div class="nav-icons">
                <button id="theme-toggle" class="nav-icon" title="Toggle Theme">
                    <i class="ph ph-sun"></i>
                </button>
                <a href="login.html" id="user-btn" class="nav-icon" title="Account">
                    <i class="ph ph-user"></i>
                </a>
                <a href="wishlist.html" class="nav-icon active" title="Wishlist">
                    <i class="ph ph-heart"></i>
                    <span id="wishlist-count" class="badge" style="display:none;">0</span>
                </a>
                <a href="cart.html" class="nav-icon" title="Cart">
                    <i class="ph ph-shopping-bag"></i>
                    <span id="cart-count" class="badge" style="display:none;">0</span>
                </a>
                <button id="mobile-menu-btn" class="mobile-menu-btn">
                    <i class="ph ph-list"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Wishlist Section -->
    <section class="section wishlist-section">
        <div class="container">
            <div class="text-center mb-4 reveal">
                <h1 class="title-serif mb-1">Your Wishlist</h1>
                <p class="text-muted">A collection of your favorite premium pieces.</p>
            </div>

            <div id="wishlist-content">
                <!-- Dynamically rendered via wishlist.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>&copy; 2026 Cloth. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Back to top -->
    <button id="backToTop" title="Back to top"><i class="ph ph-arrow-up"></i></button>

    <!-- Scripts -->
    <script src="js/products.js"></script>
    <script src="js/store.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
    <script src="js/wishlist.js"></script>
</body>
</html>
