<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Cloth Luxury</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .shop-header {
            position: relative;
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            padding: calc(var(--space-xl) + 80px) 0 var(--space-lg);
        }
        .shop-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55);
            z-index: 1;
        }
        .shop-header-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .shop-header .container {
            position: relative;
            z-index: 2;
        }
        
        .shop-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        /* Filters Sidebar */
        .shop-filters {
            width: 250px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            background: var(--clr-surface-glass);
            backdrop-filter: var(--blur-glass);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--clr-border);
        }
        .filter-group {
            margin-bottom: 1.5rem;
        }
        .filter-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--clr-border);
        }
        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .filter-list label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--clr-text-muted);
            transition: var(--transition);
        }
        .filter-list label:hover {
            color: var(--clr-text-main);
        }
        .filter-list input[type="radio"], 
        .filter-list input[type="checkbox"] {
            accent-color: var(--clr-accent);
        }

        /* Search & Sort Bar */
        .shop-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--clr-border);
        }
        .product-count {
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .search-box {
            position: relative;
            width: 300px;
        }
        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border-radius: 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--clr-border);
            color: var(--clr-text-main);
        }
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--clr-text-muted);
        }
        .sort-box select {
            background: transparent;
            color: var(--clr-text-main);
            border: 1px solid var(--clr-border);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .sort-box select option {
            background: var(--clr-surface);
            color: var(--clr-text-main);
        }

        /* Main Content */
        .shop-main {
            flex-grow: 1;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        
        .no-results {
            text-align: center;
            padding: 4rem 0;
            color: var(--clr-text-muted);
            font-size: 1.2rem;
        }

        @media (max-width: 992px) {
            .shop-layout {
                flex-direction: column;
            }
            .shop-filters {
                width: 100%;
                position: static;
                margin-bottom: 2rem;
            }
            .shop-topbar {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Page Loader -->
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Navbar -->
    <nav id="navbar" class="navbar scrolled">
        <div class="container nav-container">
            <a href="index.html" class="logo">Cloth<span>.</span></a>
            <ul id="nav-links" class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="shop.html" class="nav-link active">Shop</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="faq.html" class="nav-link">FAQ</a></li>
            </ul>
            <div class="nav-icons">
                <button id="theme-toggle" class="nav-icon"><i class="ph ph-sun"></i></button>
                <a href="login.html" id="user-btn" class="nav-icon"><i class="ph ph-user"></i></a>
                <a href="wishlist.html" class="nav-icon">
                    <i class="ph ph-heart"></i>
                    <span id="wishlist-count" class="badge" style="display:none;">0</span>
                </a>
                <a href="cart.html" class="nav-icon">
                    <i class="ph ph-shopping-bag"></i>
                    <span id="cart-count" class="badge" style="display:none;">0</span>
                </a>
                <button id="mobile-menu-btn" class="mobile-menu-btn"><i class="ph ph-list"></i></button>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="shop-header">
        <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1920&q=80" alt="Luxury Fashion Collection" class="shop-header-bg" loading="eager">
        <div class="container reveal">
            <h1 class="title-serif mb-1">The Collection</h1>
            <p class="text-muted">Explore our latest arrivals and timeless classics.</p>
        </div>
    </header>

    <!-- Shop Content -->
    <section class="section pt-0">
        <div class="container shop-layout">
            
            <!-- Filters -->
            <aside class="shop-filters reveal-left">
                <div class="filter-group">
                    <h3 class="filter-title">Categories</h3>
                    <div class="filter-list">
                        <label><input type="radio" name="category" value="all" checked> All Products</label>
                        <label><input type="radio" name="category" value="Dresses"> Dresses</label>
                        <label><input type="radio" name="category" value="Outerwear"> Outerwear</label>
                        <label><input type="radio" name="category" value="Tops"> Tops</label>
                        <label><input type="radio" name="category" value="Bottoms"> Bottoms</label>
                        <label><input type="radio" name="category" value="Knitwear"> Knitwear</label>
                        <label><input type="radio" name="category" value="Accessories"> Accessories</label>
                    </div>
                </div>

                <div class="filter-group">
                    <h3 class="filter-title">Filter By</h3>
                    <div class="filter-list">
                        <label><input type="checkbox" id="filter-sale"> On Sale</label>
                        <label><input type="checkbox" id="filter-new"> New Arrivals</label>
                    </div>
                </div>
            </aside>

            <!-- Main -->
            <main class="shop-main">
                <div class="shop-topbar reveal">
                    <div class="search-box">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search products...">
                    </div>
                    <div class="sort-box">
                        <select id="sort-select">
                            <option value="default">Default Sorting</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="name-asc">Name: A to Z</option>
                        </select>
                    </div>
                </div>

                <p id="product-count" class="product-count text-muted"></p>

                <div id="shop-grid" class="products-grid">
                    <!-- Products will be injected here -->
                </div>
            </main>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>&copy; 2026 Cloth. All rights reserved.</p>
                <div class="payment-icons">
                    <i class="ph ph-credit-card"></i>
                    <i class="ph ph-paypal-logo"></i>
                    <i class="ph ph-currency-btc"></i>
                </div>
            </div>
        </div>
    </footer>

    <!-- Back to top -->
    <button id="backToTop" title="Back to top"><i class="ph ph-arrow-up"></i></button>

    <!-- Scripts -->
    <script src="js/products.js"></script>
    <script src="js/store.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
