<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Cloth Luxury</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body {
            background: var(--clr-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .success-card {
            background: var(--clr-surface-glass);
            backdrop-filter: var(--blur-glass);
            border: 1px solid var(--clr-border);
            border-radius: 20px;
            padding: 4rem 2rem;
            max-width: 600px;
            width: 90%;
            box-shadow: var(--shadow-glass);
            animation: slideUp 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .check-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.1);
            color: var(--clr-success);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 2rem;
            position: relative;
        }
        .check-circle::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 2px solid var(--clr-success);
            border-radius: 50%;
            animation: ripple 2s infinite ease-out;
        }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .success-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .order-details {
            background: rgba(0,0,0,0.2);
            padding: 1.5rem;
            border-radius: 12px;
            margin: 2rem 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            text-align: left;
        }
        .order-details div {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .detail-label {
            font-size: 0.8rem;
            color: var(--clr-text-muted);
            text-transform: uppercase;
        }
        .detail-val {
            font-weight: 600;
            color: var(--clr-text-main);
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }
        @media (max-width: 576px) {
            .order-details { grid-template-columns: 1fr; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="check-circle">
            <i class="ph ph-check"></i>
        </div>
        <h1 class="title-serif success-title">Order Confirmed!</h1>
        <p class="text-muted">Thank you for your purchase. We've received your order and are getting it ready for shipment.</p>

        <div class="order-details" id="order-details-box">
            <!-- Injected via JS -->
        </div>

        <div class="actions">
            <a href="index.html" class="btn btn-outline">Continue Shopping</a>
            <button class="btn btn-accent" onclick="downloadInvoice()"><i class="ph ph-download-simple" style="margin-right: 5px;"></i> Download Invoice</button>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lastOrder = JSON.parse(localStorage.getItem('cloth_last_order'));
            
            if(!lastOrder) {
                document.getElementById('order-details-box').innerHTML = '<div style="grid-column:1/-1; text-align:center;">No recent order found.</div>';
                return;
            }

            const deliveryDate = new Date();
            deliveryDate.setDate(deliveryDate.getDate() + 4); // 4 days from now

            document.getElementById('order-details-box').innerHTML = `
                <div>
                    <span class="detail-label">Order Number</span>
                    <span class="detail-val">${lastOrder.id}</span>
                </div>
                <div>
                    <span class="detail-label">Total Amount</span>
                    <span class="detail-val">$${lastOrder.total.toFixed(2)}</span>
                </div>
                <div>
                    <span class="detail-label">Items</span>
                    <span class="detail-val">${lastOrder.items}</span>
                </div>
                <div>
                    <span class="detail-label">Est. Delivery</span>
                    <span class="detail-val">${deliveryDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                </div>
            `;
        });

        function downloadInvoice() {
            // Dummy invoice download
            const lastOrder = JSON.parse(localStorage.getItem('cloth_last_order'));
            if(lastOrder) {
                alert(`Downloading dummy invoice for order ${lastOrder.id}...`);
            }
        }
    </script>
</body>
</html>
